name: Promote approved site to main
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Copy approved tree onto main and remove this workflow
        run: |
          set -euo pipefail
          SRC=173701382f3bac25e0a9570e64dda3a9f9a56917
          git fetch origin "$SRC"
          git checkout "$SRC" -- .
          rm -rf .github
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Add category tabs, hoodies, coming-soon hats, and updated tee colors"
          git push origin HEAD:main
