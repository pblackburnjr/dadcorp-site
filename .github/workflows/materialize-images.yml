name: Materialize image assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image assets, remove helper files, and commit
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.b64' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .b64 files to materialize"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            rm -f "$f"
            echo "decoded $out"
          done
          rm -f .github/workflows/materialize-images.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add hoodie, hat, and updated shirt image assets"
            git push
          fi
